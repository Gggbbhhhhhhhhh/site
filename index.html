<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus Metrics</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ff6b6b,#f7d060,#4cc9f0,#7b61ff);
    background-size:300% 300%;
    animation:drift 14s ease infinite;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @keyframes drift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  .card{
    background:#ffffff;
    border-radius:18px;
    padding:48px 40px;
    text-align:center;
    max-width:380px;
    width:90%;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .badge{
    width:56px;height:56px;
    border-radius:16px;
    margin:0 auto 20px;
    background:linear-gradient(135deg,#ff6b6b,#7b61ff);
  }
  h1{
    font-size:1.4rem;
    color:#1a1a1a;
  }
  p{
    margin-top:10px;
    color:#6b6b6b;
    font-size:.95rem;
  }
  .pill{
    margin-top:26px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#eafbf0;
    color:#1f9254;
    padding:8px 16px;
    border-radius:999px;
    font-size:.85rem;
    font-weight:600;
  }
  .pill .dot{
    width:8px;height:8px;border-radius:50%;background:#1f9254;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge"></div>
    <h1>Nimbus Metrics</h1>
    <p>Keeping an eye on your services, every thirty seconds.</p>
    <div class="pill"><span class="dot"></span>All systems normal</div>
  </div>
</body>
</html>
